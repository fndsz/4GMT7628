# Description: Build OpenWrt using GitHub Actions
#
# ============================================================
# 修复版：fndsz/4GMT7628 + fndsz/immortalwrt(openwrt-21.02)
#         + fndsz/mmdvm-op + fndsz/mmdvmpatch
# ============================================================

name:  mt7628_mmdvm

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/fndsz/immortalwrt
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 2102.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  MMDVM_PATCH_URL: https://raw.githubusercontent.com/fndsz/mmdvmpatch/main/mmdvm.patch
  MMDVM_FEED_URL: https://github.com/fndsz/mmdvm-op.git

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        # 添加 mmdvm feed
        echo "src-git mmdvm $MMDVM_FEED_URL" >> feeds.conf.default
        echo "Added mmdvm feed: $MMDVM_FEED_URL"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ========== 关键修复：精确打补丁 ==========
    - name: Apply mmdvm patch (fixed for 21.02)
      run: |
        cd openwrt

        # 下载补丁
        echo "Downloading mmdvm.patch..."
        curl -fsSL $MMDVM_PATCH_URL -o /tmp/mmdvm.patch

        echo "=== Patch preview ==="
        head -5 /tmp/mmdvm.patch

        # 关键：找到 mmdvm-luci 包的真实路径
        # feed 安装后路径通常是 feeds/mmdvm/mmdvm-luci/luci-app-mmdvm
        # 或 package/feeds/mmdvm/mmdvm-luci/luci-app-mmdvm
        MMDPKG=$(find . -type f -name Makefile | xargs grep -l "PKG_NAME:=luci-app-mmdvm" 2>/dev/null | head -n1 | xargs dirname)

        if [ -z "$MMDPKG" ]; then
          echo "::error::Cannot find luci-app-mmdvm package!"
          echo "Searching for any mmdvm references:"
          find . -type d -name '*mmdvm*' 2>/dev/null | head -20
          exit 1
        fi

        echo "Found luci-app-mmdvm at: $MMDPKG"

        # 关键修复：检查补丁文件格式
        # fndsz/mmdvmpatch 的 mmdvm.patch 内部路径前缀是 "mmdvm-luci/luci-app-mmdvm/..."
        # 但 feed 安装后实际路径可能不同
        # 需要查看 Makefile 确认 PKG_SOURCE_DIR 或直接看文件结构

        # 检查补丁里的路径前缀
        PATCH_PREFIX=$(head -3 /tmp/mmdvm.patch | grep "^diff --git" | head -1 | sed 's/diff --git a\///' | cut -d'/' -f1)
        echo "Patch prefix: $PATCH_PREFIX"

        # 查看目标目录的结构
        echo "=== Target directory structure ==="
        ls -la "$MMDPKG/"
        echo "=== luasrc/controller/mmdvm/ (if exists) ==="
        ls -la "$MMDPKG/luasrc/controller/mmdvm/" 2>/dev/null || echo "(not found at this path)"

        # 确定补丁内的路径前缀与实际路径的映射
        # 补丁里写的是 a/mmdvm-luci/luci-app-mmdvm/luasrc/...
        # 实际目录是 $MMDPKG/luasrc/...
        # 所以需要去掉 "mmdvm-luci/luci-app-mmdvm/" 前缀

        # 创建修复后的补丁
        echo "Creating fixed patch..."
        sed 's|a/mmdvm-luci/luci-app-mmdvm/|a/|g; s|b/mmdvm-luci/luci-app-mmdvm/|b/|g' /tmp/mmdvm.patch > /tmp/mmdvm-fixed.patch

        # 验证修复后的补丁
        echo "=== Fixed patch preview ==="
        head -5 /tmp/mmdvm-fixed.patch

        # 在包目录内应用补丁
        echo "Applying patch to $MMDPKG..."
        cd "$MMDPKG"
        patch -p1 < /tmp/mmdvm-fixed.patch
        PATCH_RC=$?
        if [ $PATCH_RC -ne 0 ]; then
          echo "::warning::patch -p1 failed, trying -p2..."
          patch -p2 < /tmp/mmdvm-fixed.patch
          PATCH_RC=$?
        fi
        if [ $PATCH_RC -ne 0 ]; then
          echo "::error::Failed to apply mmdvm patch!"
          exit 1
        fi
        echo "✅ Patch applied successfully"

        # 关键：清理包编译缓存，强制重新编译
        cd /workdir/openwrt
        make package/mmdvm-luci/clean

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt

        # 用 sed 安全写入配置（避免重复）
        # 注意：2102.config 里 luci-app-mmdvm 是 not set 状态
        # 需要启用 mmdvm 全家桶
        sed -i 's/^# CONFIG_PACKAGE_mmdvm is not set/CONFIG_PACKAGE_mmdvm=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_mmdvm-cal is not set/CONFIG_PACKAGE_mmdvm-cal=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_mmdvm-host is not set/CONFIG_PACKAGE_mmdvm-host=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_mmdvm-luci is not set/CONFIG_PACKAGE_mmdvm-luci=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_mmdvm-luci-i18n-zh-cn is not set/CONFIG_PACKAGE_mmdvm-luci-i18n-zh-cn=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_luci-app-mmdvm is not set/CONFIG_PACKAGE_luci-app-mmdvm=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_libmmdvm is not set/CONFIG_PACKAGE_libmmdvm=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_mmdvm-crossmode is not set/CONFIG_PACKAGE_mmdvm-crossmode=y/' .config

        # dnsmasq 冲突处理：2102.config 用的是 dnsmasq-full，禁用 dnsmasq
        sed -i 's/^CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config

        # mac80211.sh 安全处理：存在才改
        WIFI_SH=$(find package -path '*mac80211/files/lib/wifi/mac80211.sh' 2>/dev/null | head -n1)
        if [ -n "$WIFI_SH" ]; then
            echo "Found mac80211.sh at: $WIFI_SH"
            # diy-part2.sh 里的 sed 如果有问题，这里已经安全处理了
        else
            echo "::notice::mac80211.sh not found, skipping wifi sed (21.02 safe)"
        fi

        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    # ========== 关键修复：单线程编译，暴露真实错误 ==========
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "Using single-thread compile with verbose output..."
        make -j1 V=s 2>&1 | tee /tmp/build.log
        BUILD_RC=${PIPESTATUS[0]}
        if [ $BUILD_RC -ne 0 ]; then
          echo "::error::Build failed with exit code $BUILD_RC"
          echo "=== Last 50 lines of build log ==="
          tail -50 /tmp/build.log
          exit $BUILD_RC
        fi
        echo "::set-output name=status::success"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "::set-output name=status::success"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "::set-output name=url::$(cat cowtransfer.log | grep https | cut -f3 -d' ')"

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "::set-output name=url::$(cat wetransfer.log | grep https | cut -f3 -d' ')"

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "::set-output name=release_tag::$(date +"%Y.%m.%d-%H%M")"
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "::set-output name=status::success"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
